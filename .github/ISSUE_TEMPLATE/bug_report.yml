name: Bug report
description: Something went wrong, or the program did something unexpected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the program deleted something it shouldn't have, or could be misused to gain administrator rights, please **don't** use this form. Report it privately instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How did you run it (double-click, or which switches)? What was open at the time?
      placeholder: |
        1. Double-clicked cleanup_c_drive_portable.cmd
        2. Accepted the UAC prompt
        3. ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type winver, and copy the version line.
      placeholder: Windows 11 Pro 24H2 (OS Build 26100.xxxx)
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Account type
      options:
        - Administrator account
        - Standard account (someone else typed the administrator password)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: |
        The log's location is shown at the end of the run (under %LOCALAPPDATA%\CDriveCleanup; the administrator window's log is under %WINDIR%\Logs\CDriveCleanup). Remove anything personal, such as your user name, before pasting.
      render: text
  - type: checkboxes
    id: latest
    attributes:
      label: Checks
      options:
        - label: I am using the latest version from the main branch.
          required: true
