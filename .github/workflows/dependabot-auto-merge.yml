name: Dependabot auto-merge

# Approves Dependabot's pull requests and turns on squash auto-merge, so each
# one merges by itself as soon as the required CI check passes. A failing
# check leaves the pull request open for a person to look at.

on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    name: Approve and auto-merge
    # Both conditions: the pull request was opened by Dependabot AND this run
    # was triggered by Dependabot, so a person pushing to a Dependabot branch
    # never gets an automatic approval.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.repository == 'RichardZak70/harddrive-cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Approve
        run: gh pr review --approve "$PR_URL"
      - name: Enable squash auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
